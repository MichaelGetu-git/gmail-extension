<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Zemenay Email Tracker</title>
  <style>
    :root { --blue:#0b5ed7; --ink:#172033; --muted:#68748b; --line:#e5eaf2 }
    * { box-sizing:border-box } body { margin:0; min-height:100vh; background:#f4f7fc; color:var(--ink); font:15px Inter,system-ui,sans-serif }
    main { max-width:1180px; margin:auto; padding:28px 20px 48px }
    header { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:28px }
    .brand { display:flex; align-items:center; gap:12px }.mark { display:grid; place-items:center; width:42px; height:42px; border-radius:12px; background:var(--blue); color:#fff; font-weight:800; font-size:19px; box-shadow:0 8px 20px #0b5ed733 }
    h1 { margin:0; font-size:25px; letter-spacing:-.5px } .sub { color:var(--muted); margin:4px 0 0 }
    .bar,.card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px; margin:16px 0; box-shadow:0 8px 24px #243b5a08 }
    .bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap }.bar input { flex:1; min-width:220px }
    input,button { font:inherit; padding:11px 13px; border:1px solid #ccd5e3; border-radius:9px } button { cursor:pointer; background:var(--blue); color:#fff; border:0; font-weight:650; padding-inline:18px } button:hover { background:#094eaf }
    .tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:14px }.tile { padding:20px; border-radius:14px; background:#fff; border:1px solid var(--line) }.tile:nth-child(2) { background:#eef5ff; border-color:#d8e7ff }.value { font-size:30px; font-weight:750; letter-spacing:-1px }.label { color:var(--muted); margin-top:5px }
    .card-title { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px }.card-title h2 { font-size:17px; margin:0 }.hint { color:var(--muted); font-size:13px }
    .scroll { overflow:auto } table { width:100%; border-collapse:collapse; white-space:nowrap } th { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.06em } th,td { text-align:left; padding:13px 10px; border-bottom:1px solid #edf0f5 } td strong { display:block } td small { display:block; color:var(--muted); margin-top:3px } .yes { color:#16803c; font-weight:650 } .muted { color:#778197 } .empty { text-align:center; padding:30px; color:var(--muted) }
    .danger { background:#fff1f1; color:#b42318; border:1px solid #f3c5c2; padding:8px 12px; font-weight:650 }.danger:hover { background:#ffe4e2 }.delete-one { background:transparent; color:#b42318; border:1px solid #f0c4c0; padding:6px 9px; font-size:12px }.delete-one:hover { background:#fff1f1 }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; flex-wrap:wrap }.toolbar input { min-width:250px; flex:1 }.pager { display:flex; align-items:center; justify-content:center; gap:14px; padding-top:16px }.pager button { padding:7px 12px }.pager button:disabled { opacity:.45; cursor:not-allowed }
    @media (max-width:900px) { .tiles { grid-template-columns:repeat(2,1fr) } }
    @media (max-width:700px) { header { align-items:flex-start; flex-direction:column }.tiles { grid-template-columns:1fr } main { padding-inline:14px } }
  </style>
</head>
<body><main>
  <header><div class="brand"><div class="mark">Z</div><div><h1>Zemenay Email Tracker</h1><p class="sub">Outreach performance at a glance</p></div></div></header>
  <div class="bar">
    <input id="key" type="password" placeholder="Dashboard key">
    <button id="load">Load statistics</button>
    <span id="status" class="muted"></span>
  </div>
  <section id="tiles" class="tiles"></section>
  <div class="card scroll"><div class="card-title"><h2>Recent outreach</h2><button id="clearAll" class="danger">Delete all data</button></div><div class="toolbar"><input id="search" type="search" placeholder="Search recipient, company, segment, or subject"><select id="stateFilter"><option value="all">All messages</option><option value="opened">Opened</option><option value="not-opened">Not opened</option></select><span class="hint">The initial sender-side pixel load is excluded</span></div><table><thead><tr><th>Recipient</th><th>Segment</th><th>Sent</th><th>Status</th><th>Opens</th><th>Manage</th></tr></thead><tbody id="rows"></tbody></table><div class="pager"><button id="previous">Previous</button><span id="pageInfo" class="hint">Page 1 of 1</span><button id="next">Next</button></div></div>
</main><script src="./app.js"></script></body>
</html>
